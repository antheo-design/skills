<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing</title>
<style>
  body { margin: 0; padding: 48px; background: #fafafa; font: 14px/1.5 system-ui, sans-serif; color: #111; }
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; margin: 0 auto; }
  .plan { padding: 24px; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; }
  .plan h3 { margin: 0; font-size: 16px; }
  .price { font-size: 13px; margin: 8px 0 16px; }
  .price b { font-size: 13px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #111; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
  <div class="plans">
    <div class="plan"><h3>Team</h3><p class="price"><b>$15</b> per seat / month</p><button>Choose Team</button></div>
    <div class="plan"><h3>Business</h3><p class="price"><b>$35</b> per seat / month</p><button>Choose Business</button></div>
  </div>
</body>
</html>
