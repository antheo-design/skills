<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro plan</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1a1a; font: 14px/1.5 system-ui, sans-serif; }
  .scene { position: relative; width: 320px; height: 200px; border-radius: 24px; overflow: hidden;
    background: radial-gradient(circle at 25% 40%, #ff5ca8, transparent 55%), radial-gradient(circle at 75% 60%, #ffb347, transparent 55%), #2a2a2a; }
  .glass { position: absolute; inset: 40px 48px; border-radius: 16px; display: grid; place-items: center;
    background: rgb(255 255 255 / 0.16); box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.45);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; font-weight: 600; font-size: 18px; }
  .glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background-image: radial-gradient(rgb(255 255 255 / 0.2) 0.6px, transparent 0.8px); background-size: 3px 3px; }
</style>
</head>
<body>
  <div class="scene"><div class="glass">Pro plan</div></div>
</body>
</html>
