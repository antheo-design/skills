<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Penfold</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap">
<link rel="stylesheet" href="../skills/antheo-build/references/quiet.css">
<style>
  /* the app bar (build rule 11): a neutral logo tile, the product, the one context the page needs */
  .bar { display: flex; align-items: center; gap: var(--s-2); height: var(--h-bar); padding-inline: var(--gutter); }
  .logo { display: grid; place-items: center; width: var(--s-5); height: var(--s-5); border-radius: var(--r-tag); background: var(--primary); color: var(--on-primary); }
  .logo svg { width: var(--s-3); height: var(--s-3); }
  .product, strong { font-weight: var(--w-strong); }
  .context { color: var(--text-2); }
  main { width: min(var(--w-settings), 100% - 2 * var(--gutter)); margin: var(--s-8) auto var(--s-16); display: grid; gap: var(--gap-section); }
  section { display: grid; gap: var(--s-3); }
  .card { display: grid; gap: var(--gap-field); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-field); }
  label { display: block; margin-block-end: var(--gap-label); font-weight: var(--w-strong); }
  .actions { display: flex; align-items: center; gap: var(--s-3); }
  /* switches: one row each, a hairline between repeating rows only */
  .switches { padding-block: 0; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); min-height: var(--h-row); padding-block: var(--s-3); }
  .setting + .setting { border-block-start: 1px solid var(--line); }
  .setting p { color: var(--text-2); }
  .danger { color: var(--danger); }
  @media (max-width: 47.99rem) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="bar">
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 10V2l8 8V2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span class="product">Penfold</span>
  <span class="context">Maya Lindqvist</span>
</header>
<main>
  <h1 class="t-page">Settings</h1>

  <section aria-labelledby="profile">
    <h2 class="t-title" id="profile">Profile</h2>
    <form class="card" onsubmit="event.preventDefault(); this.querySelector('[type=submit]').textContent = 'Saved'">
      <div class="row">
        <div><label for="name">Full name</label><input class="field" id="name" autocomplete="name" value="Maya Lindqvist"></div>
        <div><label for="email">Email</label><input class="field" id="email" type="email" autocomplete="email" value="maya@northwind.studio"></div>
      </div>
      <div class="actions"><button class="btn btn-primary" type="submit">Save profile</button></div>
    </form>
  </section>

  <section aria-labelledby="notifications">
    <h2 class="t-title" id="notifications">Email me when</h2>
    <div class="card switches">
      <div class="setting"><div><strong id="s1">Someone comments</strong><p>On projects you follow</p></div><button class="switch" role="switch" aria-checked="true" aria-labelledby="s1" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') !== 'true')"></button></div>
      <div class="setting"><div><strong id="s2">You're mentioned</strong><p>Anywhere in Penfold</p></div><button class="switch" role="switch" aria-checked="true" aria-labelledby="s2" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') !== 'true')"></button></div>
      <div class="setting"><div><strong id="s3">A weekly summary is ready</strong><p>Every Monday at 9:00</p></div><button class="switch" role="switch" aria-checked="false" aria-labelledby="s3" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') !== 'true')"></button></div>
    </div>
  </section>

  <section aria-labelledby="account">
    <h2 class="t-title" id="account">Account</h2>
    <div class="card switches">
      <div class="setting"><div><strong>Delete your account</strong><p>Your 12 projects and their files are removed for good</p></div><button class="btn danger" type="button">Delete account…</button></div>
    </div>
  </section>
</main>
</body>
</html>
